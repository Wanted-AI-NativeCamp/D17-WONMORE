<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WONMORE — 오늘도 하나 더</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap" rel="stylesheet"><style>:root{font-family:'DM Sans','Noto Sans KR',sans-serif;color:#252638;background:#fbfbfe}*{box-sizing:border-box}body{margin:0}button{font:inherit}header{max-width:1240px;margin:auto;display:flex;align-items:center;justify-content:space-between;padding:30px 44px}.logo{font-weight:800;letter-spacing:-1.2px;font-size:23px}.logo i{display:inline-block;width:9px;height:9px;border-radius:50%;background:#7971f5;margin-left:3px}header small{color:#9294a5;font-size:12px;letter-spacing:2px}main{max-width:1240px;margin:auto;padding:45px 44px 100px}.eyebrow{font-size:12px;letter-spacing:3px;color:#7770dc;font-weight:800}.hero h1{font-size:clamp(68px,10vw,144px);line-height:1.05;letter-spacing:-.09em;margin:18px 0 10px;font-weight:800}.hero h1 span{background:linear-gradient(100deg,#526cda 8%,#8e72e7 55%,#e28dbf);background-clip:text;color:transparent}.hero p{font-size:clamp(19px,2.5vw,29px);font-weight:700;letter-spacing:-1px;margin:12px 0}.hero .sub{font-size:14px;color:#88899d;font-weight:400;letter-spacing:0;line-height:1.9}.services{margin-top:82px;display:grid;grid-template-columns:310px 1fr;gap:54px;align-items:center}.side .intro{font-size:14px;color:#9999a8;margin-bottom:22px}.service-tab{width:100%;display:flex;gap:17px;text-align:left;background:transparent;border:0;border-left:3px solid transparent;padding:20px 16px;cursor:pointer;transition:.25s}.service-tab:hover{background:#f4f3fb}.service-tab.active{border-left-color:#8074f1;background:#f6f4ff;border-radius:0 16px 16px 0}.number{font-size:13px;color:#9c9faf;border:1px solid #e4e4ed;border-radius:50%;width:29px;height:29px;display:grid;place-items:center;flex-shrink:0}.active .number{color:#7569e5;border-color:#afa8f9}.tab-title{font-weight:800;font-size:19px;color:#a5a7b5;letter-spacing:-.5px}.active .tab-title{color:#292a3a}.tab-desc{font-size:12px;color:#75768f;line-height:1.8;margin-top:9px;display:none}.active .tab-desc{display:block}.preview{border-radius:34px;min-height:505px;background:linear-gradient(125deg,#e0e8ff,#eae4ff 52%,#fff4fa);padding:44px;position:relative;overflow:hidden;box-shadow:0 22px 55px #7470b012}.preview:before{content:'';position:absolute;width:340px;height:340px;border-radius:50%;background:#ffffff66;filter:blur(25px);right:-90px;top:-100px}.mock{position:relative;max-width:570px;margin:28px auto 0;border-radius:24px;background:#fff;box-shadow:0 24px 70px #62618425;padding:31px;min-height:345px}.mock-top{display:flex;justify-content:space-between;align-items:center}.mock-top b{font-size:14px}.pill{font-size:11px;border-radius:30px;background:#f0eeff;color:#7769dd;padding:8px 12px}.mock h2{font-size:31px;letter-spacing:-1px;margin:24px 0 8px}.mock p{font-size:13px;color:#8a8b9a;line-height:1.9;margin:0 0 24px}.mock-row{border:1px solid #eeeeF5;border-radius:13px;padding:16px;margin:10px 0;display:flex;align-items:center;justify-content:space-between;font-size:13px;font-weight:600}.dot{width:10px;height:10px;border-radius:50%;background:#8e83ed;display:inline-block;margin-right:12px}.arrow{color:#9b94d8}.footer{margin-top:70px;border-top:1px solid #ebebf1;padding-top:25px;display:flex;justify-content:space-between;color:#a0a0b1;font-size:12px}.cta{display:inline-block;text-decoration:none;background:#302d50;color:#fff;border-radius:50px;padding:13px 19px;font-size:12px;margin-top:8px}.cta[hidden]{display:none}@media(max-width:760px){header{padding:24px}main{padding:30px 24px 70px}.services{grid-template-columns:1fr;gap:22px;margin-top:52px}.side .intro{margin-bottom:8px}.service-tab{display:inline-flex;width:50%;vertical-align:top;min-height:84px;padding:12px 8px;gap:8px}.tab-title{font-size:15px}.number{width:23px;height:23px;font-size:11px}.preview{padding:18px;min-height:430px;border-radius:23px}.mock{padding:22px;min-height:320px}.mock h2{font-size:25px}.hero h1{font-size:clamp(55px,12vw,85px)}header small{display:none}}</style></head><body><header><div class="logo">WONMORE<i></i></div><small>ONE MORE, EVERY DAY</small></header><main><section class="hero"><div class="eyebrow">LEARN MORE. GROW MORE.</div><h1>WON<span>MORE.</span></h1><p>오늘도 하나 더, 원모어!</p><p class="sub">배우고, 나누고, 기록하고, 다시 성장하는 곳.<br>작은 배움이 모여 더 큰 가능성이 되는 AI 학습 경험.</p></section><section class="services"><nav class="side" aria-label="서비스 소개"><div class="intro">네 가지 경험, 하나의 성장 흐름</div><div id="tabs"></div></nav><div class="preview"><div class="mock" aria-live="polite"><div class="mock-top"><b>WONMORE / <span id="mini-name">LearnFlow</span></b><span class="pill" id="badge">01 / LEARN</span></div><h2 id="mock-title">배움을 더 쉽게.</h2><p id="mock-desc">수업을 탐색하고, 막힌 지점을 기록하며<br>나만의 학습 흐름을 만들어요.</p><div id="mock-items"></div><a id="link" class="cta" href="#" hidden>서비스 살펴보기 ↗</a></div></div></section><div class="footer"><span>© 2026 WONMORE</span><span>ONE MORE STEP, TOGETHER.</span></div></main><script>const services=[{name:'LearnFlow',tag:'LEARN',title:'배움을 더 쉽게.',desc:'수업을 탐색하고, 막힌 지점을 기록하며<br>나만의 학습 흐름을 만들어요.',summary:'수업 자료를 따라가며 나만의 학습 경로를 만들어요.',items:['오늘의 학습 자료 확인','어려움과 해결 과정 기록','지난 수업 다시 살펴보기']},{name:'PeerLoop',tag:'CONNECT',title:'배움을 함께.',desc:'서로의 질문과 해결 경험을 나누며<br>동료와 함께 성장해요.',summary:'질문과 해결 경험을 나누는 동료 학습 공간.',items:['동료에게 질문 남기기','해결 경험과 노하우 공유','함께 만드는 학습 아카이브']},{name:'GrowthLog',tag:'GROW',title:'성장을 눈에 보이게.',desc:'어제의 어려움과 오늘의 발견을 모아<br>나만의 성장 기록을 만들어요.',summary:'매일의 배움과 발견을 쌓는 성장 기록.',items:['오늘의 학습 회고','어려움과 성취 기록','쌓여가는 성장 이력']},{name:'AI Tutor',tag:'REVIEW',title:'한 번 더, 내 것으로.',desc:'배운 내용을 퀴즈로 확인하고<br>부족한 부분을 다시 익혀요.',summary:'배운 내용을 맞춤형 복습으로 연결해요.',items:['오늘 배운 내용 복습','AI 퀴즈로 이해도 확인','부족한 부분 다시 학습']}];const tabs=document.querySelector('#tabs');services.forEach((s,i)=>{const b=document.createElement('button');b.className='service-tab';b.type='button';b.innerHTML=`<span class="number">${i+1}</span><span><span class="tab-title">${s.name}</span><span class="tab-desc">${s.summary}</span></span>`;b.addEventListener('click',()=>show(i));tabs.appendChild(b)});function show(i){const s=services[i];document.querySelectorAll('.service-tab').forEach((b,j)=>{b.classList.toggle('active',j===i);b.setAttribute('aria-pressed',j===i)});document.querySelector('#mini-name').textContent=s.name;document.querySelector('#badge').textContent=`0${i+1} / ${s.tag}`;document.querySelector('#mock-title').textContent=s.title;document.querySelector('#mock-desc').innerHTML=s.desc;document.querySelector('#mock-items').innerHTML=s.items.map(t=>`<div class="mock-row"><span><i class="dot"></i>${t}</span><span class="arrow">↗</span></div>`).join('')}show(0)</script></body></html>
